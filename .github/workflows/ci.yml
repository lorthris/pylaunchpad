name: PyLaunchpad CI

# CI runs on LankySV01, on the self-hosted runner gh-runner-mylaunchpad. The four matrix
# jobs share that one runner, so they run one after the other.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# One runner serves this repo. Cancel a superseded run, so that the runner checks only
# the last push to each ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A pull request from a fork never runs on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lankysv01, pylaunchpad-ci]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      # The packages go into a venv under RUNNER_TEMP. The self-hosted runner keeps one
      # shared interpreter per version for all jobs, and a job must not change it.
      run: |
        python -m venv --clear "$RUNNER_TEMP/venv"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/venv/bin/python" -m pip install -e .
        "$RUNNER_TEMP/venv/bin/python" -m pip install pytest pytest-asyncio

    - name: Run automated test suite
      run: |
        pytest -v tests/

    - name: Verify release distribution packaging
      run: |
        python distribution/build_release.py
