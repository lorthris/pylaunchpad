<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}PyLaunchpad - Production FastAPI SaaS Boilerplate{% endblock %}</title>
  <meta name="description" content="Production-grade FastAPI micro-SaaS and AI API starter kit with Polar.sh Merchant of Record billing, authentication, and Docker deployment.">
  <link rel="stylesheet" href="/static/css/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="/" class="logo-group">
        <span class="logo-badge">PyLP</span>
        <span>PyLaunchpad</span>
      </a>
      <nav class="nav-links">
        <a href="/#features">Features</a>
        <a href="/#architecture">Architecture</a>
        <a href="/#pricing">Pricing</a>
        <a href="/api/docs" target="_blank" rel="noopener">API Docs</a>
        <a href="/login" class="btn btn-secondary btn-sm">Sign In</a>
        <a href="/#pricing" class="btn btn-primary btn-sm">Get Starter Kit</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <p>&copy; 2026 PyLaunchpad. All rights reserved. Commercial developer licence.</p>
      <div style="display: flex; gap: 1.5rem; font-size: 0.9rem;">
        <a href="https://lorthris.github.io/pylaunchpad/docs.html" target="_blank" rel="noopener" style="color: var(--text-dim); text-decoration: none;">Documentation</a>
        <a href="https://lorthris.github.io/pylaunchpad/terms.html" target="_blank" rel="noopener" style="color: var(--text-dim); text-decoration: none;">Terms &amp; Privacy</a>
        <a href="https://github.com/lorthris/pylaunchpad" target="_blank" rel="noopener" style="color: var(--text-dim); text-decoration: none;">GitHub</a>
      </div>
    </div>
  </footer>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
