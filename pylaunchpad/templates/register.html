{% extends "base.html" %}

{% block title %}Create Account - PyLaunchpad{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-box">
    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; text-align: center;">Create an Account</h2>
    <p style="color: var(--text-secondary); text-align: center; font-size: 0.9rem; margin-bottom: 2rem;">
      Start building and testing with your personal developer workspace.
    </p>

    <div id="register-error" style="display: none; padding: 0.75rem; border-radius: 0.375rem; background-color: rgba(244, 63, 94, 0.1); border: 1px solid var(--accent-rose); color: #fecdd3; font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

    <form onsubmit="PyLaunchpad.handleRegister(event)">
      <div class="form-group">
        <label class="form-label" for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Alex Rivers">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" required placeholder="developer@example.com">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" minlength="8" required placeholder="At least 8 characters">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
      Already registered? <a href="/login" style="color: var(--accent-primary);">Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
