{% extends "base.html" %}

{% block title %}Sign In - PyLaunchpad{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-box">
    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; text-align: center;">Welcome Back</h2>
    <p style="color: var(--text-secondary); text-align: center; font-size: 0.9rem; margin-bottom: 2rem;">
      Sign in to manage your micro-SaaS API keys and billing.
    </p>

    <div id="login-error" style="display: none; padding: 0.75rem; border-radius: 0.375rem; background-color: rgba(244, 63, 94, 0.1); border: 1px solid var(--accent-rose); color: #fecdd3; font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

    <form onsubmit="PyLaunchpad.handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" required placeholder="developer@example.com">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
      Don't have an account? <a href="/register" style="color: var(--accent-primary);">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
